<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fdf8ee">
<title>IDOYSTORE – Premium Jastip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1822;--muted:#8b7480;--brand:#ec2f77;--brand2:#ff5c97;--brand-dark:#c21c5c;--brand-soft:#ffe6ef;--line:rgba(236,47,119,.16);--err:#c4261d;--err-soft:#fdeceb}
*{box-sizing:border-box;margin:0}
html{background:#fdf8ee!important;color-scheme:only light;min-height:100%}
body{position:relative;min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#fdf8ee!important;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(200px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}

.hero{margin-top:calc(16px + env(safe-area-inset-top,0px));padding:26px 22px;border-radius:28px;color:#fff;
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);box-shadow:0 18px 40px -18px rgba(236,47,119,.7);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.18)}
.hero h1{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;position:relative}
.hero p{margin-top:6px;font-size:.92rem;font-weight:500;opacity:.95;position:relative;max-width:34ch}

section{margin-top:34px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sec-head i{width:6px;height:22px;border-radius:6px;background:linear-gradient(var(--brand),var(--brand2))}
h2{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.sub{font-size:.85rem;color:var(--muted);margin:0 0 16px 16px}
h3.group{font-size:.95rem;font-weight:700;margin:24px 0 12px;color:var(--brand-dark);display:flex;align-items:center;gap:10px}
h3.group::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media(min-width:900px){.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Kartu kaca */
.card{display:flex;flex-direction:column;padding:10px;border-radius:24px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.95);outline:1px solid var(--line);outline-offset:-1px;
  box-shadow:0 14px 34px -16px rgba(236,47,119,.45),inset 0 1px 0 rgba(255,255,255,.9)}
.frame{aspect-ratio:1/1;background:#fff;border-radius:16px;display:grid;place-items:center;padding:12px;position:relative;overflow:hidden}
.frame img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none}
.body{padding:12px 6px 6px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h4{font-size:.93rem;font-weight:700;line-height:1.3}
.price{font-size:1rem;font-weight:800;color:var(--brand)}
.act{margin-top:auto}
.add{width:100%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;font-size:.9rem;padding:11px;border-radius:14px;box-shadow:0 8px 18px -8px rgba(236,47,119,.7);transition:transform .1s}
.add:active{transform:scale(.97)}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--brand-soft);border-radius:14px;padding:3px}
.step button{width:40px;height:40px;border-radius:11px;font-size:1.25rem;font-weight:700;color:var(--brand-dark)}
.step button.plus{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.step output{font-weight:800}

/* Koleksi mewah: tidak bisa diklik */
.lux .card{pointer-events:none;user-select:none;-webkit-user-select:none;cursor:default}
.brandname{font-size:.72rem;font-weight:700;color:var(--brand-dark);letter-spacing:.05em;text-transform:uppercase}
.soon{align-self:flex-start;font-size:.75rem;font-weight:700;color:var(--brand-dark);background:var(--brand-soft);border-radius:999px;padding:4px 11px}

/* Divisi mobil: kartu lebar ala showroom */
.cars{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:720px){.cars{grid-template-columns:1fr 1fr;gap:20px}}
.car .frame{aspect-ratio:16/10;padding:18px 18px 26px;background:radial-gradient(60% 22% at 50% 82%,rgba(236,47,119,.16),transparent 75%),#fff}
.car .frame img{filter:drop-shadow(0 14px 12px rgba(42,24,34,.18))}
.car .chip{position:absolute;left:12px;top:12px;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));padding:5px 12px;border-radius:999px}
.car .body{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:14px 8px 8px}
.car .body h4{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
.car .body .t{display:grid;gap:2px}

/* Pesanan (bawah) */
.order{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.order-in{max-width:980px;margin:0 auto;display:grid;gap:10px;padding:14px;border-radius:26px;
  background:rgba(255,255,255,.78);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.95);outline:1px solid var(--line);outline-offset:-1px;box-shadow:0 -6px 40px -12px rgba(236,47,119,.5)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum small{color:var(--muted);font-size:.82rem;font-weight:600}
.sum strong{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;color:var(--brand)}
.row{display:grid;gap:10px}
.row input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;font-size:1rem;background:#fff}
.row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700;padding:14px 22px;border-radius:14px;white-space:nowrap;box-shadow:0 10px 20px -10px rgba(236,47,119,.8)}
.wa:active{transform:scale(.98)}
.error{display:none;background:var(--err-soft);color:var(--err);font-size:.82rem;font-weight:600;padding:8px 12px;border-radius:10px}
.error.show{display:block}
@media(min-width:720px){
  body{padding-bottom:150px}
  .order-in{grid-template-columns:auto 1fr;align-items:center;column-gap:22px}
  .sum{flex-direction:column;align-items:flex-start;gap:0}
  .row{grid-template-columns:1fr auto}
  .error{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>IDOYSTORE</h1>
    <p>Belanja Cerdas, Gaya Bebas</p>
  </header>

  <section>
    <div class="sec-head"><i></i><h2>Kebutuhan harian</h2></div>

    <div class="grid" id="real-products"></div>
  </section>

  <section class="lux" aria-label="Koleksi mewah">
    <div class="sec-head"><i></i><h2>Koleksi mewah</h2></div>
    <p class="sub">Hanya untuk dilihat. Belum bisa dipesan.</p>
    <div id="lux-groups"></div>
  </section>
</div>

<div class="order">

        Kirim ke WhatsApp
      </button>
    </div>
    <div class="error" id="err" role="alert"></div>
  </div>
</div>

const cart = {}; products.forEach(p => cart[p.id] = 0);
const $ = id => document.getElementById(id);
const rp = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);

function action(p){
  const q = cart[p.id];
  if (!q) return `<button class="add" data-act="inc" data-id="${p.id}" aria-label="Tambah ${p.name}">Tambah</button>`;
  return `<div class="step" role="group" aria-label="Jumlah ${p.name}">
    <button data-act="dec" data-id="${p.id}" aria-label="Kurangi ${p.name}">&minus;</button>
    <output>${q}</output>
    <button class="plus" data-act="inc" data-id="${p.id}" aria-label="Tambah ${p.name}">+</button></div>`;
}

$('real-products').innerHTML = products.map(p => `
  <article class="card">
    <div class="frame"><img src="${p.img}" alt="${p.name}"></div>
    <div class="body"><h4>${p.name}</h4><p class="price">${rp(p.price)}</p>
    <div class="act" id="act-${p.id}">${action(p)}</div></div>
  </article>`).join('');

$('lux-groups').innerHTML = luxury.map(g => g.group === 'Mobil' ? `
  <h3 class="group">${g.group}</h3>
  <div class="cars">${g.items.map(i => `
    <div class="card car" aria-disabled="true">
      <div class="frame"><span class="chip">${i.brand}</span><img src="${i.img}" alt="${i.brand} ${i.name}" draggable="false"></div>
      <div class="body"><div class="t"><span class="brandname">${i.brand}</span><h4>${i.name}</h4></div><span class="soon">Segera hadir</span></div>
    </div>`).join('')}</div>` : `
  <h3 class="group">${g.group}</h3>
  <div class="grid">${g.items.map(i => `
    <div class="card" aria-disabled="true">
      <div class="frame"><img src="${i.img}" alt="${i.brand} ${i.name}" draggable="false"></div>
      <div class="body"><span class="brandname">${i.brand}</span><h4>${i.name}</h4><span class="soon">Segera hadir</span></div>
    </div>`).join('')}</div>`).join('');

function summary(){
  let total = 0, count = 0;
  products.forEach(p => { total += p.price * cart[p.id]; count += cart[p.id]; });
  $('total').textContent = rp(total);
  $('count').textContent = count ? `${count} barang` : 'Belum ada barang';
  return { total, count };
}
const showErr = m => { $('err').textContent = m; $('err').classList.add('show'); };
const hideErr = () => $('err').classList.remove('show');

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = +b.dataset.id, p = products.find(x => x.id === id);
  cart[id] = Math.max(0, cart[id] + (b.dataset.act === 'inc' ? 1 : -1));
  $('act-' + id).innerHTML = action(p);
  const n = $('act-' + id).querySelector('[data-act="inc"]'); if (n) n.focus({preventScroll:true});
  hideErr(); summary();
});

$('name').addEventListener('input', hideErr);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('send').addEventListener('click', send);

function send(){
  const name = $('name').value.trim();
  const { total, count } = summary();
  if (!count){ showErr('Pilih barang dulu ya.'); return; }
  if (!name){ showErr('Isi nama pemesan dulu.'); $('name').focus(); return; }
  hideErr();
  let msg = `Halo IDOYSTORE! Saya *${name}* mau PO Jastip besok pagi:\n\n`;
  products.filter(p => cart[p.id] > 0).forEach(p => {
    msg += `▪ ${cart[p.id]}x ${p.name} (${rp(cart[p.id] * p.price)})\n`;
  });
  msg += `\n*Total Bayar: ${rp(total)}*\n_(Pembayaran COD saat barang diantar)_`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}
summary();
</script>
</body>
